[project]
name = "revproxy"
version = "0.1.0"
description = "Reverse proxy configured by a TOML file that reloads itself when the file changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "watchfiles>=1.3.0",
]

[project.scripts]
revproxy = "revproxy:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-aiohttp>=1.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
